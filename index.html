// ============================================================
// ASSET LOADER
// Tries /assets/<filename>; on error, stores a colored placeholder.
// ============================================================
const assetCache = {};        // assetKey -> Image | null
const assetPlaceholders = {}; // assetKey -> { label, color }

/** Kick off loading one asset; idempotent */
function loadAsset(key, file, label, color) {
  if (key in assetCache) return;
  assetCache[key] = null; // loading sentinel
  assetPlaceholders[key] = { label, color };
  const img = new Image();
  img.onload  = () => { assetCache[key] = img; };
  img.onerror = () => { assetCache[key] = null; }; // keep placeholder
  img.src = "/assets/" + file;
}

/**
 * Draw an asset or its colored placeholder.
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} key
 * @param {number} x y w h
 */
function drawAsset(ctx, key, x, y, w, h) {
  const img = assetCache[key];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x, y, w, h);
    return;
  }
  // Placeholder rectangle
  const ph = assetPlaceholders[key] || { label: key, color: "#333" };
  ctx.fillStyle = ph.color;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#666";
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // Centered label with word-wrap
  ctx.save();
  ctx.font = "11px 'Courier New', monospace";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const words = ph.label.split(" ");
  const lineH = 14;
  const lines = [];
  let cur = "";
  for (const word of words) {
    const test = cur ? cur + " " + word : word;
    if (ctx.measureText(test).width > w - 6) {
      if (cur) lines.push(cur);
      cur = word;
    } else { cur = test; }
  }
  if (cur) lines.push(cur);
  const startY = y + h / 2 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, x + w / 2, startY + i * lineH));
  ctx.restore();
}

/**
 * Draw one frame from a horizontal sprite sheet.
 * Falls back to drawAsset placeholder if image not loaded.
 */
function drawSpriteFrame(ctx, key, frameW, frameH, frameIdx, x, y, dw, dh) {
  const img = assetCache[key];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, frameIdx * frameW, 0, frameW, frameH, x, y, dw, dh);
  } else {
    drawAsset(ctx, key, x, y, dw, dh);
  }
}

/** Create per-room tracking objects */
function buildRoomState() {
  const rs = {};
  for (const id of Object.keys(ROOMS)) {
    rs[id] = {
      revealedHotspots: new Set(), // hotspot IDs that started hidden but are now revealed
      pickedUp:         new Set(), // item strings already collected from this room
    };
  }
  return rs;
}

// ============================================================
// ADJACENCY MAP — computed once from ROOMS exits
// ============================================================
function buildAdjacency() {
  const adj = {};
  for (const id of Object.keys(ROOMS)) adj[id] = new Set();
  for (const [id, room] of Object.entries(ROOMS)) {
    for (const dest of Object.values(room.exits)) {
      if (dest.startsWith("_")) continue; // special pseudo-rooms
      if (ROOMS[dest]) {
        adj[id].add(dest);
        adj[dest].add(id);
      }
    }
  }
  return adj;
}
const ADJ = buildAdjacency();

// ============================================================
// BILAX AI — exact port of the text-game logic
// ============================================================

/**
 * Move Bilax one step.
 * @param {Set} extraForbidden  Rooms Bilax must not enter this turn.
 */
function moveBilax(extraForbidden) {
  // listenSafe: freeze Bilax from entering the player's room
  const forbid = new Set(extraForbidden);
  if (S.listenSafe) forbid.add(S.room);

  const neighbors = Array.from(ADJ[S.bilax] || []).filter(r => !forbid.has(r));

  if (Math.random() < CONFIG.BILAX_MOVE_CHANCE && neighbors.length > 0) {
    const target = neighbors[Math.floor(Math.random() * neighbors.length)];
    if (target === S.room) {
      // Bilax is stepping toward the player's room — grace turn
      S.bilaxEntering = S.room;
      playSound("bilax_footstep");
    } else {
      S.bilax = target;
      S.bilaxEntering = null;
      playSound("bilax_footstep");
    }
  } else {
    S.bilaxEntering = null; // didn't move, clear any previous entering flag
  }

  // Safety net: if Bilax somehow landed in a forbidden room, force him out
  if (forbid.has(S.bilax)) {
    const safeNbrs = Array.from(ADJ[S.bilax] || []).filter(r => !forbid.has(r));
    if (safeNbrs.length > 0) {
      S.bilax = safeNbrs[Math.floor(Math.random() * safeNbrs.length)];
    }
  }
}

/**
 * Compute hide success based on the current hideStreak.
 * Returns "safe" | "hiding_safe" | "caught"
 */
function checkEncounter() {
  const inRoom = S.bilax === S.room || S.bilaxEntering === S.room;
  if (!inRoom) return "safe";
  if (S.hiding) {
    const thresh = S.hideStreak === 1 ? 1.0
                 : S.hideStreak === 2 ? 0.80
                 : S.hideStreak === 3 ? 0.60
                 : 0.50;
    return Math.random() < thresh ? "hiding_safe" : "caught";
  }
  return "caught";
}

/**
 * Full encounter check — called after every action turn.
 * Handles the bilaxEntering grace mechanic.
 */
function checkBilaxEncounter() {
  if (S.bilaxEntering !== null) {
    if (S.room === S.bilaxEntering) {
      // Bilax steps in
      S.bilax = S.room;
      S.bilaxEntering = null;
      const result = checkEncounter();
      if (result === "hiding_safe") {
        showDialog("Bilax looms over your hiding spot... then moves on.", "warn");
        playSound("bilax_leave");
        // Shuffle Bilax out of the room
        const out = Array.from(ADJ[S.bilax] || []).filter(r => r !== S.room);
        if (out.length > 0) S.bilax = out[Math.floor(Math.random() * out.length)];
        S.hideStreak++;
      } else if (result === "caught") {
        triggerGameOver();
      }
    } else {
      // Player fled before Bilax arrived
      S.bilaxEntering = null;
    }
  } else {
    // Normal encounter check (Bilax was already in room, or not)
    if (checkEncounter() === "caught") triggerGameOver();
  }
}

/**
 * End-of-turn processing: move Bilax (unless skipped), then check encounter.
 * @param {boolean} skipMove  True when LISTEN is used (Bilax stays put)
 */
function doTurn(skipMove) {
  if (S.gameOver || S.gameWon) return;
  if (!skipMove) moveBilax(new Set());
  S.listenSafe = false; // consumed
  checkBilaxEncounter();
}

// ============================================================
// GAME ACTIONS
// ============================================================

/** Enqueue a dialog line and start it if nothing is showing */
function showDialog(text, type) {
  S.dialogQueue.push({ text, type: type || "normal", timer: CONFIG.DIALOG_DURATION });
  if (!S.dialog) advanceDialog();
}

/** Pop the next line from the queue into the active dialog */
function advanceDialog() {
  S.dialog = S.dialogQueue.length > 0 ? S.dialogQueue.shift() : null;
}

/** Transition to game-over state */
function triggerGameOver() {
  if (S.gameOver || S.gameWon) return;
  S.gameOver  = true;
  S.dialog    = null;
  S.dialogQueue = [];
  S.hiding    = false;
  S.hideStreak = 0;
  playSound("bilax_found_you");
  playSound("game_over");
  S.scene    = "gameover";
  S.endAlpha = 0;
}

/** Transition to win state */
function escaped() {
  if (S.gameOver || S.gameWon) return;
  S.gameWon  = true;
  S.dialog   = null;
  S.dialogQueue = [];
  playSound("door_unlock");
  playSound("door_open");
  playSound("game_win");
  S.scene    = "win";
  S.endAlpha = 0;
}

/** True when the flashlight is in inventory (lights up the attic) */
function atticIsLit() { return S.inv.includes("flashlight"); }

/** Is a hotspot currently interactable? (not hidden, not already picked up) */
function hotspotVisible(roomId, hs) {
  const rs = S.roomState[roomId];
  if (hs.type === "item") {
    if (rs.pickedUp.has(hs.item)) return false;
    if (hs.hidden && !rs.revealedHotspots.has(hs.id)) return false;
  }
  return true;
}

/** Execute a verb on a hotspot after the player has walked to it */
function executeAction(verb, hotspot) {
  if (!hotspot) { doTurn(false); return; }

  // ---- WALK TO ----
  if (verb === "WALK TO" && hotspot.type === "exit") {
    handleExit(hotspot);
    return;
  }

  // ---- LOOK AT ----
  if (verb === "LOOK AT") {
    const itemDesc = {
      key:        "An old brass key. Might open the front door.",
      flashlight: "A compact flashlight. Useful in the dark.",
      note:       "A crumpled note: \"The key is in the attic trunk. DO NOT GO UP THERE.\""
    };
    if (hotspot.type === "item") {
      showDialog(itemDesc[hotspot.item] || `You see the ${hotspot.label}.`, "normal");
    } else {
      showDialog(`You study the ${hotspot.label} carefully.`, "normal");
    }
    doTurn(false); return;
  }

  // ---- TAKE ----
  if (verb === "TAKE") {
    if (hotspot.type !== "item") { showDialog("You can't take that.", "warn"); doTurn(false); return; }
    const rs = S.roomState[S.room];
    if (!rs.pickedUp.has(hotspot.item)) {
      rs.pickedUp.add(hotspot.item);
      S.inv.push(hotspot.item);
      showDialog(`You pick up the ${hotspot.label}.`, "normal");
      playSound("item_pickup");
      if (hotspot.item === "flashlight") showDialog("The flashlight flickers on — better.", "normal");
    }
    doTurn(false); return;
  }

  // ---- EXAMINE ----
  if (verb === "EXAMINE") {
    if (hotspot.id === "examine_trunk") {
      if (!atticIsLit()) {
        showDialog("It's pitch dark. You can't see a thing in this attic.", "warn");
        doTurn(false); return;
      }
      S.roomState["attic"].revealedHotspots.add("item_key");
      showDialog("You pry open the old trunk. Inside gleams a BRASS KEY!", "normal");
      doTurn(false); return;
    }
    if (hotspot.id === "examine_drawer") {
      S.roomState["kitchen"].revealedHotspots.add("item_flashlight");
      showDialog("You rummage through the kitchen drawer and find a FLASHLIGHT!", "normal");
      doTurn(false); return;
    }
    showDialog(`You examine the ${hotspot.label}. Nothing useful.`, "normal");
    doTurn(false); return;
  }

  // ---- HIDE / STOP HIDING ----
  if (verb === "HIDE" || verb === "HIDE HERE") {
    if (!S.hiding) {
      S.hiding = true;
      S.hideStreak++;
      showDialog(`You squeeze ${hotspot.label.toLowerCase()}. Don't breathe.`, "normal");
      playSound("player_hide");
    }
    doTurn(false); return;
  }
  if (verb === "STOP HIDING") {
    S.hiding = false;
    S.hideStreak = 0;
    showDialog("You step out from hiding.", "normal");
    playSound("player_unhide");
    doTurn(false); return;
  }

  // ---- LISTEN ----
  if (verb === "LISTEN") {
    S.listenSafe = true;
    const bilaxName = ROOMS[S.bilax] ? ROOMS[S.bilax].name : "somewhere";
    if (S.bilax === S.room) {
      showDialog("You hear heavy breathing RIGHT IN THIS ROOM. BILAX IS HERE!", "danger");
    } else if (ADJ[S.room] && ADJ[S.room].has(S.bilax)) {
      showDialog(`You hear slow, deliberate footsteps... Bilax is in the ${bilaxName}.`, "warn");
    } else {
      showDialog("Silence. Bilax seems far away for now.", "normal");
    }
    doTurn(true); // Bilax does not move on LISTEN turns
    return;
  }

  // ---- USE (inventory item on hotspot) ----
  if (verb === "USE" && S.selectedItem) {
    if (S.selectedItem === "key" && hotspot.id === "exit_door") {
      showDialog("You slide the key into the lock — CLICK. The front door swings open!", "normal");
      doTurn(false);
      setTimeout(escaped, 1600);
      return;
    }
    if (S.selectedItem === "flashlight" && S.room === "attic") {
      showDialog("You sweep the flashlight beam across the attic.", "normal");
      doTurn(false); return;
    }
    showDialog("That doesn't seem to do anything.", "warn");
    doTurn(false); return;
  }

  showDialog("You can't do that here.", "warn");
  doTurn(false);
}

/** Handle clicking an exit hotspot */
function handleExit(hotspot) {
  if (hotspot.dest === "_front_door") {
    if (S.inv.includes("key")) {
      showDialog("You unlock the front door with the brass key!", "normal");
      doTurn(false);
      setTimeout(escaped, 1600);
    } else {
      showDialog("The front door is locked. You need to find a key.", "warn");
      doTurn(false);
    }
    return;
  }
  beginTransition(hotspot.dest);
}

/** Start a room-transition fade-out/in animation */
function beginTransition(nextRoom) {
  if (S.transition.active) return;
  S.transition = { active: true, dir: "out", frame: 0, nextRoom };
  S.hiding      = false;
  S.hideStreak  = 0;
  S.pendingAction = null;
  S.verbCoin    = null;
  playSound("room_transition");
}

/** Mid-transition: actually swap rooms and reposition the player */
function changeRoom(nextRoom) {
  S.room = nextRoom;
  const rd = ROOMS[nextRoom];
  S.player.x = rd.playerStart.x;
  S.player.y = rd.playerStart.y;
  S.player.targetX = rd.playerStart.x;
  S.player.targetY = rd.playerStart.y;
  S.player.moving  = false;
  S.dialog         = null;
  S.dialogQueue    = [];
  S.verbCoin       = null;
  S.activeVerb     = null;

  if (S.bilax === nextRoom) playSound("bilax_enter");
  doTurn(false); // triggers Bilax move & encounter check on arrival
}

// ============================================================
// CANVAS & MOUSE
// ============================================================
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");
let mouse    = { x: 0, y: 0 };

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (CONFIG.WIDTH  / r.width);
  mouse.y = (e.clientY - r.top)  * (CONFIG.HEIGHT / r.height);
  if (S.scene === "game") updateHover();
});

canvas.addEventListener("click",       e => { e.preventDefault(); handleClick(e);      });
canvas.addEventListener("contextmenu", e => { e.preventDefault(); handleRightClick(e); });

/** Recompute hovered hotspot and cursor style */
function updateHover() {
  if (S.verbCoin) { canvas.style.cursor = "pointer"; return; }

  if (mouse.y >= CONFIG.GAME_HEIGHT) {
    const slotHit = getInventorySlotAt(mouse.x, mouse.y);
    const verbHit = getVerbButtonAt(mouse.x, mouse.y);
    canvas.style.cursor = (slotHit !== null || verbHit) ? "pointer" : "default";
    S.hoveredHotspot = null;
    return;
  }

  const hs = getHotspotAt(mouse.x, mouse.y);
  S.hoveredHotspot = hs;
  canvas.style.cursor = hs ? "pointer" : "crosshair";
}

function handleClick(e) {
  const r  = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (CONFIG.WIDTH  / r.width);
  const my = (e.clientY - r.top)  * (CONFIG.HEIGHT / r.height);

  // -- Boot --
  if (S.scene === "boot") { if (!S.bootFading) S.bootFading = true; return; }

  // -- End screens --
  if (S.scene === "gameover" || S.scene === "win") {
    if (isRestartButtonHit(mx, my)) restartGame();
    return;
  }

  if (S.scene !== "game" || S.transition.active || S.gameOver || S.gameWon) return;

  // -- Verb coin open --
  if (S.verbCoin) {
    const hit = getVerbCoinHit(mx, my);
    const coinHotspot = S.verbCoin.hotspot; // capture before clearing
    S.verbCoin = null;
    canvas.style.cursor = "crosshair";
    if (hit) walkToHotspot(coinHotspot, hit);
    return;
  }

  // Panel area
  if (my >= CONFIG.GAME_HEIGHT) {
    const slotIdx = getInventorySlotAt(mx, my);
    if (slotIdx !== null && slotIdx < S.inv.length) {
      const item = S.inv[slotIdx];
      if (S.selectedItem === item) { S.selectedItem = null; S.activeVerb = null; }
      else { S.selectedItem = item; S.activeVerb = "USE"; }
      return;
    }
    const verb = getVerbButtonAt(mx, my);
    if (verb) {
      if (verb === "LISTEN") { executeAction("LISTEN", { id: "_listen", label: "", type: "meta" }); return; }
      S.activeVerb   = (S.activeVerb === verb) ? null : verb;
      if (verb !== "USE") S.selectedItem = null;
      return;
    }
    return;
  }

  // Game area
  const hs = getHotspotAt(mx, my);
  if (hs) {
    if (S.activeVerb) {
      const v = S.activeVerb;
      S.activeVerb  = null;
      S.selectedItem = null;
      walkToHotspot(hs, v);
    } else if (hs.type === "exit") {
      walkToHotspot(hs, "WALK TO");
    } else {
      openVerbCoin(hs, mx, my);
    }
  } else {
    // Free walk
    const tx = Math.max(20,  Math.min(940, mx));
    const ty = Math.max(CONFIG.WALK_Y_MIN, Math.min(CONFIG.WALK_Y_MAX, my));
    S.player.targetX = tx;
    S.player.targetY = ty;
    S.player.moving  = true;
    S.pendingAction  = null;
    if (S.hiding) {
      S.hiding = false; S.hideStreak = 0;
      showDialog("You step out of hiding.", "normal");
      playSound("player_unhide");
    }
  }
}

function handleRightClick(e) {
  const r  = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (CONFIG.WIDTH  / r.width);
  const my = (e.clientY - r.top)  * (CONFIG.HEIGHT / r.height);
  if (S.scene !== "game" || S.transition.active) return;
  if (my >= CONFIG.GAME_HEIGHT) return;
  const hs = getHotspotAt(mx, my);
  if (hs) openVerbCoin(hs, mx, my);
  else S.verbCoin = null;
}

/** Queue a walk-then-action */
function walkToHotspot(hs, verb) {
  const tx = Math.max(20, Math.min(940, hs.x + hs.w / 2));
  const ty = Math.max(CONFIG.WALK_Y_MIN, Math.min(CONFIG.WALK_Y_MAX, hs.y + hs.h / 2));
  S.player.targetX = tx;
  S.player.targetY = ty;
  S.player.moving  = true;
  S.pendingAction  = { verb, hotspot: hs };
  if (S.hiding) { S.hiding = false; S.hideStreak = 0; playSound("player_unhide"); }
}

/** Open the radial verb-coin menu */
function openVerbCoin(hs, x, y) {
  const verbs = getVerbsForHotspot(hs);
  S.verbCoin = { hotspot: hs, x, y, verbs };
}

function getVerbsForHotspot(hs) {
  if (hs.type === "exit")    return ["WALK TO"];
  if (hs.type === "item")    return S.selectedItem ? ["LOOK AT","TAKE","USE"] : ["LOOK AT","TAKE"];
  if (hs.type === "examine") return ["EXAMINE"];
  if (hs.type === "hide")    return [S.hiding ? "STOP HIDING" : "HIDE HERE"];
  return ["LOOK AT"];
}

// ============================================================
// HIT TESTING HELPERS
// ============================================================

function getHotspotAt(mx, my) {
  if (my >= CONFIG.GAME_HEIGHT) return null;
  const hotspots = ROOMS[S.room].hotspots;
  for (let i = hotspots.length - 1; i >= 0; i--) {
    const hs = hotspots[i];
    if (!hotspotVisible(S.room, hs)) continue;
    if (mx >= hs.x && mx <= hs.x + hs.w && my >= hs.y && my <= hs.y + hs.h) return hs;
  }
  return null;
}

/** Returns slot index 0-5, or null */
function getInventorySlotAt(mx, my) {
  const slotSz = 48, gap = 12, startX = 16;
  const startY = CONFIG.GAME_HEIGHT + (CONFIG.PANEL_HEIGHT - slotSz) / 2;
  for (let i = 0; i < 6; i++) {
    const sx = startX + i * (slotSz + gap);
    if (mx >= sx && mx <= sx + slotSz && my >= startY && my <= startY + slotSz) return i;
  }
  return null;
}

// Verb button layout constants
const VERB_LABELS  = ["LOOK", "TAKE", "HIDE", "LISTEN", "USE"];
const VERB_ACTIONS = { LOOK:"LOOK AT", TAKE:"TAKE", HIDE:"HIDE", LISTEN:"LISTEN", USE:"USE" };
const VERB_BTN_W   = 80, VERB_BTN_H = 32, VERB_BTN_GAP = 10, VERB_BTN_START_X = 500;

function getVerbButtonAt(mx, my) {
  const startY = CONFIG.GAME_HEIGHT + (CONFIG.PANEL_HEIGHT - VERB_BTN_H) / 2;
  for (let i = 0; i < VERB_LABELS.length; i++) {
    const bx = VERB_BTN_START_X + i * (VERB_BTN_W + VERB_BTN_GAP);
    if (mx >= bx && mx <= bx + VERB_BTN_W && my >= startY && my <= startY + VERB_BTN_H) {
      return VERB_ACTIONS[VERB_LABELS[i]];
    }
  }
  return null;
}

/** Returns the verb string for a coin button if (mx,my) hits it, else null */
function getVerbCoinHit(mx, my) {
  if (!S.verbCoin) return null;
  const { x, y, verbs } = S.verbCoin;
  const r = 72, bw = 94, bh = 28;
  for (let i = 0; i < verbs.length; i++) {
    const angle = (i / verbs.length) * Math.PI * 2 - Math.PI / 2;
    const bx = x + Math.cos(angle) * r;
    const by = y + Math.sin(angle) * r;
    if (mx >= bx - bw/2 && mx <= bx + bw/2 && my >= by - bh/2 && my <= by + bh/2) return verbs[i];
  }
  return null;
}

function isRestartButtonHit(mx, my) {
  return mx >= CONFIG.WIDTH/2 - 100 && mx <= CONFIG.WIDTH/2 + 100 &&
         my >= CONFIG.HEIGHT/2 + 60  && my <= CONFIG.HEIGHT/2 + 104;
}

// ============================================================
// RENDER HELPERS
// ============================================================

/** Rounded rectangle path helper */
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);    ctx.quadraticCurveTo(x+w, y,   x+w, y+r);
  ctx.lineTo(x+w, y+h-r);  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);    ctx.quadraticCurveTo(x,   y+h, x, y+h-r);
  ctx.lineTo(x, y+r);      ctx.quadraticCurveTo(x,   y,   x+r, y);
  ctx.closePath();
  if (fill)   { ctx.fillStyle   = fill;   ctx.fill();   }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

/** Compute player draw scale from Y position (perspective depth) */
function scaleFory(y) {
  const t = (y - CONFIG.WALK_Y_MIN) / (CONFIG.WALK_Y_MAX - CONFIG.WALK_Y_MIN);
  return CONFIG.PLAYER_SCALE_MIN + Math.max(0, Math.min(1, t)) * (CONFIG.PLAYER_SCALE_MAX - CONFIG.PLAYER_SCALE_MIN);
}

// ============================================================
// SCENE: BOOT
// ============================================================
function renderBoot() {
  // Black base
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  // Subtle green noise
  ctx.fillStyle = "rgba(0,40,0,0.35)";
  for (let i = 0; i < 60; i++) {
    ctx.fillRect(Math.random()*CONFIG.WIDTH, Math.random()*CONFIG.HEIGHT, Math.random()*3+1, 1);
  }

  // Title glow pulse
  const glow = 0.55 + 0.45 * Math.sin(S.frame * 0.04);
  ctx.save();
  ctx.shadowColor = "#00ff44";
  ctx.shadowBlur  = 24 * glow;
  ctx.font = "bold 96px 'Courier New', monospace";
  ctx.fillStyle = "#00ff44";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("BILAX", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 - 65);

  ctx.shadowBlur = 10;
  ctx.font = "22px 'Courier New', monospace";
  ctx.fillStyle = "#77cc77";
  ctx.fillText("— A Point & Click Adventure —", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 5);

  ctx.shadowBlur = 0;
  ctx.font = "14px 'Courier New', monospace";
  const blinkA = 0.35 + 0.65 * Math.abs(Math.sin(S.frame * 0.065));
  ctx.fillStyle = `rgba(100,220,100,${blinkA})`;
  ctx.fillText("CLICK ANYWHERE TO BEGIN", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 68);

  ctx.font = "11px 'Courier New', monospace";
  ctx.fillStyle = "#2a5a2a";
  ctx.fillText("v1.8", CONFIG.WIDTH/2, CONFIG.HEIGHT - 18);
  ctx.restore();

  // Fade-out transition to game
  if (S.bootFading) {
    S.bootAlpha = Math.min(1, S.bootAlpha + 0.04);
    ctx.fillStyle = `rgba(0,0,0,${S.bootAlpha})`;
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    if (S.bootAlpha >= 1) {
      S.scene     = "game";
      S.bootAlpha = 0;
      playSound("ambient_house");
    }
  }
}

// ============================================================
// SCENE: GAME
// ============================================================
function renderGame() {
  renderBackground();
  renderFloorItems();
  renderBilax();
  renderPlayer();
  if (S.bilaxEntering === S.room) { renderDangerVignette(); renderBilaxDoorway(); }
  renderHotspotHighlight();
  renderDialog();
  renderPanel();
  renderHUD();
  if (S.verbCoin) renderVerbCoin();
  if (S.transition.active) renderTransition();
}

/** Draw room background (with attic dark/lit logic) */
function renderBackground() {
  let bgKey;
  if (S.room === "attic") {
    bgKey = atticIsLit() ? "bg_attic_lit" : "bg_attic_dark";
  } else {
    bgKey = "bg_" + ROOMS[S.room].bg;
  }
  drawAsset(ctx, bgKey, 0, 0, CONFIG.WIDTH, CONFIG.GAME_HEIGHT);

  // Dark overlay in unlit attic (reinforces pitch-black feel even with placeholder)
  if (S.room === "attic" && !atticIsLit()) {
    ctx.fillStyle = "rgba(0,0,0,0.74)";
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.GAME_HEIGHT);
  }
}

/** Draw world-space item sprites for items not yet picked up */
function renderFloorItems() {
  const hotspots = ROOMS[S.room].hotspots;
  for (const hs of hotspots) {
    if (hs.type !== "item") continue;
    if (!hotspotVisible(S.room, hs)) continue;
    const iw = 32, ih = 32;
    const ix = hs.x + hs.w/2 - iw/2;
    const iy = hs.y + hs.h/2 - ih/2;
    const bob = Math.sin(S.frame * 0.07 + hs.x * 0.01) * 3;
    drawAsset(ctx, "sp_item_" + hs.item, ix, iy + bob, iw, ih);
    ctx.font = CONFIG.FONT_SMALL;
    ctx.fillStyle = CONFIG.COLORS.text;
    ctx.textAlign = "center";
    ctx.fillText(hs.label, ix + iw/2, iy + ih + 14 + bob);
    ctx.textAlign = "left";
  }
}

/** Draw Bilax monster if he is present (and not in doorway state) */
function renderBilax() {
  if (S.bilax !== S.room) return;
  if (S.bilaxEntering === S.room) return; // handled by renderBilaxDoorway
  const pos = ROOMS[S.room].bilaxPos;
  const bw = 80, bh = 120;
  const pulse = 0.25 + 0.2 * Math.sin(S.frame * 0.12);
  ctx.save();
  ctx.shadowColor = "#ff0000";
  ctx.shadowBlur  = 30 * pulse;
  drawAsset(ctx, "sp_bilax_idle", pos.x - bw/2, pos.y - bh, bw, bh);
  ctx.restore();

  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = CONFIG.COLORS.danger;
  ctx.textAlign = "center";
  ctx.fillText("⚠  BILAX IS HERE — HIDE OR FLEE  ⚠", CONFIG.WIDTH/2, 20);
  ctx.textAlign = "left";
}

/** Draw Bilax silhouette appearing in doorway */
function renderBilaxDoorway() {
  const bw = 68, bh = 108;
  const bx = CONFIG.WIDTH - bw - 8;
  const by = CONFIG.GAME_HEIGHT - bh - 8;
  ctx.save();
  ctx.globalAlpha = 0.65 + 0.35 * Math.abs(Math.sin(S.frame * 0.1));
  drawAsset(ctx, "sp_bilax_doorway", bx, by, bw, bh);
  ctx.restore();

  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = CONFIG.COLORS.warn;
  ctx.textAlign = "center";
  ctx.fillText("BILAX APPROACHES — HIDE NOW!", CONFIG.WIDTH/2, 20);
  ctx.textAlign = "left";
}

/** Pulsing red border vignette when Bilax is about to enter */
function renderDangerVignette() {
  const pulse = 0.3 + 0.7 * Math.abs(Math.sin(S.frame * CONFIG.DANGER_PULSE_SPEED * 3));
  ctx.save();
  ctx.strokeStyle = `rgba(255,0,0,${pulse})`;
  ctx.lineWidth   = 10;
  ctx.strokeRect(0, 0, CONFIG.WIDTH, CONFIG.GAME_HEIGHT);
  ctx.restore();
}

/** Subtle dashed outline + label for the hovered hotspot */
function renderHotspotHighlight() {
  const hs = S.hoveredHotspot;
  if (!hs) return;
  ctx.save();
  ctx.strokeStyle = "rgba(180,255,180,0.45)";
  ctx.lineWidth   = 2;
  ctx.setLineDash([4, 5]);
  ctx.strokeRect(hs.x, hs.y, hs.w, hs.h);
  ctx.setLineDash([]);
  ctx.font      = CONFIG.FONT_SMALL;
  ctx.fillStyle = "rgba(180,255,180,0.9)";
  ctx.textAlign = "center";
  ctx.fillText(hs.label, hs.x + hs.w/2, hs.y - 5);
  ctx.textAlign = "left";
  ctx.restore();
}

/** Draw player character with walk animation and depth scaling */
function renderPlayer() {
  const p = S.player;
  const sc = scaleFory(p.y);
  const dw = 64 * sc, dh = 96 * sc;
  const px = p.x - dw/2, py = p.y - dh;

  ctx.save();

  if (S.hiding) {
    // Semi-transparent crouching sprite
    ctx.globalAlpha = 0.55;
    drawAsset(ctx, "sp_player_hide", px, py + dh * 0.25, dw * 0.82, dh * 0.75);
    ctx.globalAlpha = 1;
    ctx.font = CONFIG.FONT_SMALL;
    ctx.fillStyle = "#88ff88";
    ctx.textAlign = "center";
    ctx.fillText("(hiding)", p.x, py - 4);
    ctx.textAlign = "left";
  } else if (p.moving) {
    // Walk animation — flip horizontally when moving left
    p.walkTimer++;
    if (p.walkTimer >= 8) { p.walkTimer = 0; p.walkFrame = (p.walkFrame + 1) % 4; }
    if (p.facing === -1) {
      ctx.scale(-1, 1);
      drawSpriteFrame(ctx, "sp_player_walk", 64, 96, p.walkFrame, -p.x - dw/2, py, dw, dh);
    } else {
      drawSpriteFrame(ctx, "sp_player_walk", 64, 96, p.walkFrame, px, py, dw, dh);
    }
  } else {
    // Idle
    drawAsset(ctx, "sp_player_idle", px, py, dw, dh);
  }

  ctx.restore();

  // Drop shadow ellipse for depth cue
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, dw * 0.38, 6 * sc, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/** Render a dialog speech bubble above the player */
function renderDialog() {
  if (!S.dialog) return;
  const d = S.dialog;
  const p = S.player;
  const maxW = 330, pad = 12;

  ctx.save();
  ctx.font = CONFIG.FONT;

  // Word-wrap the text
  const lines = [];
  let cur = "";
  for (const word of d.text.split(" ")) {
    const test = cur ? cur + " " + word : word;
    if (ctx.measureText(test).width > maxW - pad * 2) { if (cur) lines.push(cur); cur = word; }
    else cur = test;
  }
  if (cur) lines.push(cur);

  const lineH = 20;
  const contentW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const boxW = Math.min(maxW, contentW + pad * 2);
  const boxH = lines.length * lineH + pad * 2;

  const sc = scaleFory(p.y);
  let bx = p.x - boxW / 2;
  let by = p.y - 96 * sc - boxH - 18;
  bx = Math.max(8, Math.min(CONFIG.WIDTH - boxW - 8, bx));
  by = Math.max(8, Math.min(CONFIG.GAME_HEIGHT - boxH - 8, by));

  const col = d.type === "danger" ? CONFIG.COLORS.danger
            : d.type === "warn"   ? CONFIG.COLORS.warn
            : CONFIG.COLORS.text;

  roundRect(ctx, bx, by, boxW, boxH, 6, "rgba(0,0,0,0.90)", col);

  ctx.fillStyle = col;
  ctx.font = CONFIG.FONT;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], bx + pad, by + pad + (i + 1) * lineH - 4);
  }

  // Bubble tail
  const tailX = Math.max(bx + 14, Math.min(bx + boxW - 14, p.x));
  ctx.beginPath();
  ctx.moveTo(tailX - 6, by + boxH);
  ctx.lineTo(tailX + 6, by + boxH);
  ctx.lineTo(tailX,     by + boxH + 10);
  ctx.closePath();
  ctx.fillStyle   = "rgba(0,0,0,0.90)";
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth   = 1;
  ctx.stroke();
  ctx.restore();
}

/** Radial verb-coin menu */
function renderVerbCoin() {
  const vc = S.verbCoin;
  const { x, y, verbs } = vc;
  const r = 72, bw = 94, bh = 28;

  // Dim the game area
  ctx.fillStyle = "rgba(0,0,0,0.48)";
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.GAME_HEIGHT);

  // Center disc
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 28, 0, Math.PI * 2);
  ctx.fillStyle   = "rgba(12,20,12,0.96)";
  ctx.fill();
  ctx.strokeStyle = "#446644";
  ctx.lineWidth   = 2;
  ctx.stroke();
  ctx.font          = CONFIG.FONT_SMALL;
  ctx.fillStyle     = CONFIG.COLORS.text;
  ctx.textAlign     = "center";
  ctx.textBaseline  = "middle";
  // Truncate label so it fits the 28px disc
  const lbl = vc.hotspot.label.length > 10 ? vc.hotspot.label.substring(0,9)+"…" : vc.hotspot.label;
  ctx.fillText(lbl, x, y);
  ctx.restore();

  // Verb buttons
  for (let i = 0; i < verbs.length; i++) {
    const angle = (i / verbs.length) * Math.PI * 2 - Math.PI / 2;
    const bx = x + Math.cos(angle) * r;
    const by = y + Math.sin(angle) * r;
    const hovered = mouse.x >= bx-bw/2 && mouse.x <= bx+bw/2 &&
                    mouse.y >= by-bh/2 && mouse.y <= by+bh/2;
    ctx.save();
    roundRect(ctx, bx-bw/2, by-bh/2, bw, bh, 4,
      hovered ? "#253d25" : "rgba(8,16,8,0.96)",
      hovered ? CONFIG.COLORS.safe : "#446644");
    ctx.font          = CONFIG.FONT_SMALL;
    ctx.fillStyle     = hovered ? "#ffffff" : CONFIG.COLORS.verbText;
    ctx.textAlign     = "center";
    ctx.textBaseline  = "middle";
    ctx.fillText(verbs[i], bx, by);
    ctx.restore();
  }
}

/** Bottom UI panel — inventory + verb buttons */
function renderPanel() {
  const py = CONFIG.GAME_HEIGHT;

  ctx.fillStyle   = CONFIG.COLORS.panel;
  ctx.fillRect(0, py, CONFIG.WIDTH, CONFIG.PANEL_HEIGHT);
  ctx.strokeStyle = CONFIG.COLORS.panelBorder;
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(CONFIG.WIDTH, py); ctx.stroke();

  // "INVENTORY:" label
  ctx.font      = CONFIG.FONT_SMALL;
  ctx.fillStyle = "#446644";
  ctx.fillText("INVENTORY:", 16, py + 16);

  // Divider between inventory and verbs
  ctx.beginPath();
  ctx.moveTo(480, py + 8); ctx.lineTo(480, py + CONFIG.PANEL_HEIGHT - 8);
  ctx.strokeStyle = "#2a2a2a"; ctx.stroke();

  // Inventory slots
  const slotSz = 48, gap = 12, startX = 16;
  const slotY  = py + (CONFIG.PANEL_HEIGHT - slotSz) / 2;
  for (let i = 0; i < 6; i++) {
    const sx       = startX + i * (slotSz + gap);
    const selected = S.inv[i] && S.inv[i] === S.selectedItem;
    roundRect(ctx, sx, slotY, slotSz, slotSz, 4,
      CONFIG.COLORS.invSlot, selected ? CONFIG.COLORS.safe : "#2e2e2e");
    if (i < S.inv.length) {
      const item = S.inv[i];
      drawAsset(ctx, "sp_item_" + item, sx + 8, slotY + 8, 32, 32);
      // Tooltip on hover
      if (mouse.x >= sx && mouse.x <= sx+slotSz && mouse.y >= slotY && mouse.y <= slotY+slotSz) {
        const labels = { key:"Brass Key", flashlight:"Flashlight", note:"Note" };
        ctx.save();
        ctx.font      = CONFIG.FONT_SMALL;
        ctx.fillStyle = CONFIG.COLORS.text;
        ctx.textAlign = "center";
        ctx.fillText(labels[item] || item, sx + slotSz/2, slotY - 6);
        ctx.restore();
      }
    }
  }

  // Verb buttons
  const btnY = py + (CONFIG.PANEL_HEIGHT - VERB_BTN_H) / 2;
  for (let i = 0; i < VERB_LABELS.length; i++) {
    const bx     = VERB_BTN_START_X + i * (VERB_BTN_W + VERB_BTN_GAP);
    const action = VERB_ACTIONS[VERB_LABELS[i]];
    const active = S.activeVerb === action;
    const hov    = mouse.x >= bx && mouse.x <= bx+VERB_BTN_W &&
                   mouse.y >= btnY && mouse.y <= btnY+VERB_BTN_H;
    ctx.save();
    roundRect(ctx, bx, btnY, VERB_BTN_W, VERB_BTN_H, 4,
      active ? "#1e3d1e" : (hov ? CONFIG.COLORS.verbHover : CONFIG.COLORS.verbBg),
      active ? CONFIG.COLORS.safe : "#3a3a3a");
    ctx.font          = "13px 'Courier New', monospace";
    ctx.fillStyle     = active ? CONFIG.COLORS.safe : CONFIG.COLORS.verbText;
    ctx.textAlign     = "center";
    ctx.textBaseline  = "middle";
    ctx.fillText(VERB_LABELS[i], bx + VERB_BTN_W/2, btnY + VERB_BTN_H/2);
    ctx.restore();
  }
}

/** HUD — room name + danger indicator dot */
function renderHUD() {
  const rd = ROOMS[S.room];
  ctx.save();
  ctx.font      = CONFIG.FONT_SMALL;
  ctx.fillStyle = "#446644";
  ctx.textAlign = "right";
  ctx.fillText(rd.name, CONFIG.WIDTH - 36, 18);
  ctx.restore();

  // Danger indicator circle
  const inRoom   = S.bilax === S.room || S.bilaxEntering === S.room;
  const adjacent = !inRoom && ADJ[S.room] && ADJ[S.room].has(S.bilax);
  let dotColor;
  if (inRoom) {
    const p = 0.4 + 0.6 * Math.abs(Math.sin(S.frame * 0.25));
    dotColor = `rgba(255,${Math.floor(40*(1-p))},${Math.floor(40*(1-p))},${0.6+0.4*p})`;
  } else if (adjacent) {
    const p = 0.4 + 0.6 * Math.abs(Math.sin(S.frame * CONFIG.DANGER_PULSE_SPEED));
    dotColor = `rgba(255,${Math.floor(160*p)},0,${0.6+0.4*p})`;
  } else {
    dotColor = CONFIG.COLORS.safe;
  }

  ctx.save();
  ctx.beginPath();
  ctx.arc(CONFIG.WIDTH - 18, 18, 8, 0, Math.PI * 2);
  ctx.fillStyle   = dotColor;
  ctx.fill();
  ctx.strokeStyle = "#222";
  ctx.lineWidth   = 1.5;
  ctx.stroke();
  ctx.font      = "10px 'Courier New', monospace";
  ctx.fillStyle = "#3a5a3a";
  ctx.textAlign = "right";
  ctx.fillText("BILAX", CONFIG.WIDTH - 28, 22);
  ctx.restore();
}

/** Fade-to-black transition overlay */
function renderTransition() {
  const t = S.transition;
  const alpha = t.dir === "out"
    ? t.frame / CONFIG.TRANSITION_FRAMES
    : 1 - (t.frame / CONFIG.TRANSITION_FRAMES);
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
}

// ============================================================
// SCENE: GAME OVER
// ============================================================
function renderGameOver() {
  S.endAlpha = Math.min(1, S.endAlpha + 0.022);
  ctx.fillStyle = `rgba(0,0,0,${S.endAlpha})`;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  if (S.endAlpha < 0.45) return;

  const a = Math.min(1, (S.endAlpha - 0.45) / 0.55);
  ctx.save();
  ctx.globalAlpha = a;

  ctx.fillStyle = "#160000";
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  ctx.shadowColor = "#ff0000";
  ctx.shadowBlur  = 32;
  ctx.font = "bold 68px 'Courier New', monospace";
  ctx.fillStyle = "#ff2222";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("BILAX FOUND YOU", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 - 64);

  ctx.shadowBlur = 0;
  ctx.font = "20px 'Courier New', monospace";
  ctx.fillStyle = "#cc3333";
  ctx.fillText("There is no escape from the darkness.", CONFIG.WIDTH/2, CONFIG.HEIGHT/2);

  const bx = CONFIG.WIDTH/2 - 100, by = CONFIG.HEIGHT/2 + 60;
  const hov = mouse.x >= bx && mouse.x <= bx+200 && mouse.y >= by && mouse.y <= by+44;
  roundRect(ctx, bx, by, 200, 44, 6, hov ? "#4a0000" : "#280000", "#aa2222");
  ctx.font = "18px 'Courier New', monospace";
  ctx.fillStyle = hov ? "#ffbbbb" : "#ff6666";
  ctx.fillText("TRY AGAIN", CONFIG.WIDTH/2, by + 22);

  ctx.restore();
  canvas.style.cursor = hov ? "pointer" : "default";
}

// ============================================================
// SCENE: WIN
// ============================================================
function renderWin() {
  S.endAlpha = Math.min(1, S.endAlpha + 0.018);
  ctx.fillStyle = `rgba(0,0,0,${S.endAlpha})`;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  if (S.endAlpha < 0.35) return;

  const a = Math.min(1, (S.endAlpha - 0.35) / 0.65);
  ctx.save();
  ctx.globalAlpha = a;

  drawAsset(ctx, "bg_win_screen", 0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  ctx.fillStyle = "rgba(0,0,18,0.58)";
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  ctx.shadowColor = "#44ffaa";
  ctx.shadowBlur  = 22;
  ctx.font = "bold 62px 'Courier New', monospace";
  ctx.fillStyle = "#44ffaa";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("ESCAPED!", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 - 62);

  ctx.shadowBlur = 0;
  ctx.font = "20px 'Courier New', monospace";
  ctx.fillStyle = "#88ffcc";
  ctx.fillText("You made it out alive.", CONFIG.WIDTH/2, CONFIG.HEIGHT/2);
  ctx.font = "14px 'Courier New', monospace";
  ctx.fillStyle = "#44cc88";
  ctx.fillText("Bilax's domain could not hold you.", CONFIG.WIDTH/2, CONFIG.HEIGHT/2 + 32);

  const bx = CONFIG.WIDTH/2 - 100, by = CONFIG.HEIGHT/2 + 80;
  const hov = mouse.x >= bx && mouse.x <= bx+200 && mouse.y >= by && mouse.y <= by+44;
  roundRect(ctx, bx, by, 200, 44, 6, hov ? "#002d1a" : "#001a0f", "#22aa66");
  ctx.font = "18px 'Courier New', monospace";
  ctx.fillStyle = hov ? "#aaffcc" : "#44ff88";
  ctx.fillText("PLAY AGAIN", CONFIG.WIDTH/2, by + 22);

  ctx.restore();
  canvas.style.cursor = hov ? "pointer" : "default";
}

// ============================================================
// UPDATE — Player movement, dialog ticks, transitions
// ============================================================

function updatePlayer() {
  const p = S.player;
  const dx = p.targetX - p.x;
  const dy = p.targetY - p.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > 2) {
    p.moving = true;
    const spd = CONFIG.PLAYER_SPEED;
    p.x += (dx / dist) * Math.min(spd, dist);
    p.y += (dy / dist) * Math.min(spd, dist);
    if (dx >  0.5) p.facing =  1;
    if (dx < -0.5) p.facing = -1;
  } else if (p.moving) {
    p.x = p.targetX;
    p.y = p.targetY;
    p.moving    = false;
    p.walkFrame = 0;
    // Fire pending action now that player has arrived
    if (S.pendingAction) {
      const { verb, hotspot } = S.pendingAction;
      S.pendingAction = null;
      executeAction(verb, hotspot);
    }
  }
}

function updateTransition() {
  if (!S.transition.active) return;
  const t = S.transition;
  t.frame++;
  if (t.dir === "out" && t.frame >= CONFIG.TRANSITION_FRAMES) {
    changeRoom(t.nextRoom);
    t.dir = "in"; t.frame = 0;
  } else if (t.dir === "in" && t.frame >= CONFIG.TRANSITION_FRAMES) {
    t.active = false;
  }
}

function updateDialog() {
  if (!S.dialog) return;
  S.dialog.timer--;
  if (S.dialog.timer <= 0) advanceDialog();
}

// ============================================================
// RESTART
// ============================================================
function restartGame() {
  initGameState();
  S.scene = "game";
  setTimeout(() => {
    showDialog("You wake up in the dark house. Find a key and escape.", "normal");
  }, 400);
  playSound("ambient_house");
}

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop() {
  ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  S.frame++;

  switch (S.scene) {
    case "boot":
      renderBoot();
      break;
    case "game":
      updatePlayer();
      updateTransition();
      updateDialog();
      renderGame();
      break;
    case "gameover":
      renderGameOver();
      break;
    case "win":
      renderWin();
      break;
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// STARTUP
// ============================================================
preloadAllAssets();
initGameState();
gameLoop();

// Show intro text once the player clicks through to the game scene
const _introPoller = setInterval(() => {
  if (S.scene === "game" && !S._introShown) {
    S._introShown = true;
    showDialog("You are trapped in the house. Find a key and escape through the front door.", "normal");
    clearInterval(_introPoller);
  }
}, 120);

</script>
